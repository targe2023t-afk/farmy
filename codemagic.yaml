workflows:
  android-release:
    name: Farmy Android Release
    max_build_duration: 60
    working_directory: farmy-new
    environment:
      node: 20.11.0
      java: 17
      android_signing:
        - farmy_keystore
      vars:
        PACKAGE_NAME: com.farmy.app
    scripts:
      - name: Install & Build Web
        script: npm install && npm run build
      - name: Capacitor Setup
        script: npx cap add android && npx cap sync android
      - name: Build APK + AAB
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - "**/*.apk"
      - "**/*.aab"
    publishing:
      email:
        recipients:
          - targe2023t@gmail.com
        notify:
          success: true
          failure: true
