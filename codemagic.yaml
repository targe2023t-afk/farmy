workflows:
  android-release:
    name: Farmy Android Release
    max_build_duration: 60
    environment:
      node: 20.11.0
      java: 17
      android_signing:
        - farmy_keystore
      groups:
        - Farmy_env
      vars:
        PACKAGE_NAME: com.farmy.app

    scripts:
      - name: Install & Build Web
        script: |
          rm -rf node_modules
          npm install
          npm run build

      - name: Add Android Platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Add Deep Link Intent Filter
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" << 'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          intent_filter = '''        <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="com.farmy.app" android:host="login-callback" />
          </intent-filter>
          '''

          if 'login-callback' not in content:
              content = content.replace('</activity>', intent_filter + '    </activity>', 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("Intent filter added.")
          else:
              print("Intent filter already present.")
          PYEOF

      - name: Configure Signing
        script: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Capacitor Sync
        script: npx cap sync android

      - name: Build APK & AAB
        script: |
          cd android
          ./gradlew assembleRelease
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - targe2023t@gmail.com
        notify:
          success: true
          failure: true
