workflows:
  android-release:
    name: Farmy Android Release
    max_build_duration: 60
    environment:
      node: 20.x
      java: 17
      android_signing:
        - farmy_keystore          # أنشئه في Codemagic → Teams → Code signing
      vars:
        PACKAGE_NAME: com.farmy.app
    scripts:
      - name: Install & Build Web
        script: npm ci && npm run build

      - name: Capacitor Sync
        script: npx cap sync android

      - name: Build APK / AAB
        script: |
          cd android
          ./gradlew bundleRelease   # AAB للـ Play Store
          # ./gradlew assembleRelease  # APK للتثبيت المباشر

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS   # JSON من Google Play Console
        track: internal   # internal → alpha → beta → production
