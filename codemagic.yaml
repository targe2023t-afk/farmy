workflows:
  android-release:
    name: Farmy Android Release
    max_build_duration: 60
    working_directory: farmy-new
    environment:
      node: 20.11.0
      java: 17
      android_signing:
        - farmy_keystore
      vars:
        PACKAGE_NAME: com.farmy.app
    scripts:
      - name: Install & Build Web
        script: npm install && npm run build
      - name: Capacitor Setup
        script: npx cap add android && npx cap sync android
      - name: Build AAB
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - farmy-new/android/app/build/outputs/bundle/release/*.aab
      - farmy-new/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - targe2023t@gmail.com
        notify:
          success: true
          failure: true
